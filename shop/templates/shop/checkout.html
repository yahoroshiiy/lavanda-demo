{% extends 'shop/base.html' %}
{% block title %}Оформление — LAVANDA{% endblock %}
{% block content %}
<section class="section checkout-page"><div class="checkout-box"><div><div class="eyebrow">ОФОРМЛЕНИЕ</div><h1>Доставка букета</h1><p class="muted">Демо-режим: до реальной оплаты ничего не списывается.</p><form id="checkoutForm"><input required name="name" placeholder="Ваше имя"><input required name="phone" placeholder="Телефон"><input required name="address" placeholder="Адрес доставки"><select name="delivery_time"><option>Сегодня, 18:00–20:00</option><option>Сегодня, 20:00–22:00</option><option>Завтра, 10:00–12:00</option></select><textarea name="comment" placeholder="Комментарий к заказу"></textarea><button class="btn primary full" type="submit">Перейти к оплате</button></form></div><div class="order-preview"><h3>Ваш заказ</h3><div id="checkoutItems"></div><hr><strong id="checkoutTotal">Итого: 0 ₽</strong></div></div></section>
{% endblock %}
{% block scripts %}<script>
(function(){const itemsBox=document.getElementById('checkoutItems'),totalBox=document.getElementById('checkoutTotal'),form=document.getElementById('checkoutForm');let total=0;function render(){const c=LAVANDA_CART.cart();total=0;const rows=[];Object.keys(c).forEach(id=>{const p=LAVANDA_CART.productMap[id],q=+c[id];if(p&&q>0){total+=p.price*q;rows.push(`<div><span>${p.name} × ${q}</span><b>${LAVANDA_CART.money(p.price*q)}</b></div>`);}});itemsBox.innerHTML=rows.length?rows.join(''):'<p class="muted">Корзина пуста. <a href="/catalog/">Выбрать букет</a></p>';totalBox.textContent='Итого: '+LAVANDA_CART.money(total);}render();form.addEventListener('submit',e=>{e.preventDefault();if(!total){alert('Сначала добавьте букет в корзину');return;}const data=Object.fromEntries(new FormData(form).entries());localStorage.setItem('lavanda_demo_customer',JSON.stringify(data));localStorage.removeItem(LAVANDA.key);location.href='/order/success/';});})();
</script>{% endblock %}
