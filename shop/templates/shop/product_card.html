<article class="product">
  <div class="product-photo-wrap">
    <button class="product-photo" type="button" data-view="{{ p.id }}" aria-label="Подробнее о {{ p.name }}">
      <img src="{{ p.image }}" alt="{{ p.name }}" loading="lazy">
      {% if p.is_hit %}<span class="tag">ХИТ</span>{% endif %}
      <span class="quick-view">Подробнее <b>↗</b></span>
    </button>
  </div>
  <div class="product-info">
    <div class="product-status"><span class="stock-dot">✓</span> В наличии <span class="stars" aria-label="5 из 5">★★★★★</span></div>
    <h3>{{ p.name }}</h3>
    <p>{{ p.description|default:'Свежая авторская композиция'|truncatechars:72 }}</p>
    <div class="product-bottom">
      <span class="price">{{ p.price|floatformat:0 }} ₽</span>
      <div class="product-actions">
        <button class="add-wide" type="button" data-add="{{ p.id }}">В корзину</button>
        <button class="details-btn" type="button" data-view="{{ p.id }}">Подробнее</button>
      </div>
    </div>
  </div>
</article>
